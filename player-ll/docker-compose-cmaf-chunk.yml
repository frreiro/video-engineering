services:
  nginx-lowlatency-cmaf:
    image: nginx:1.27-alpine
    container_name: encoding-bitrate-nginx-lowlatency
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - ./nginx/nginx-cmaf-chunk.conf:/etc/nginx/nginx.conf:ro
      - ./www:/usr/share/nginx/html:ro
    restart: unless-stopped
