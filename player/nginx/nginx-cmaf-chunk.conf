worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Ensure Nginx uses HTTP/1.1 for chunked transfer support
    proxy_http_version 1.1;
    
    # Enable HTTP 1.1 Chunked Transfer Encoding
    chunked_transfer_encoding on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    gzip off;
    keepalive_timeout 65;
    keepalive_requests 10000;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        location /media/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                application/dash+xml mpd;
                video/mp2t ts;
                video/mp4 mp4;
                video/iso.segment m4s;
                application/octet-stream init;
            }

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Accel-Buffering "no" always;

            open_file_cache off;
            aio off;
            etag off;
            if_modified_since off;

            max_ranges 10;
            expires -1;
        }

        location = /health {
            access_log off;
            return 204;
        }

        location /live/ {
            alias /usr/share/nginx/html/media/;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Accel-Buffering "no" always;

            open_file_cache off;
            aio off;
            etag off;
            if_modified_since off;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
